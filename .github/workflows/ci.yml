name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm run ts-check

      - name: Tests
        run: pnpm test

      - name: ESLint
        run: pnpm run lint

      - name: Prettier
        run: pnpm run prettier:check

      - name: Knip
        run: pnpm exec knip
        continue-on-error: true

  graphify:
    name: Graphify freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GRAPHIFY_VERSION: '0.9.36'
      GRAPHIFY_NO_BACKUP: 1
      PYTHONHASHSEED: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Update Graphify graph
        run: |
          uvx \
            --from "graphifyy[sql]==${GRAPHIFY_VERSION}" \
            graphify update .

      - name: Check Graphify freshness
        run: |
          # manifest.json contains filesystem metadata such as mtimes,
          # which can legitimately differ between local and CI checkouts.
          git restore -- graphify-out/manifest.json

          if ! git diff --quiet -- \
            graphify-out/graph.json \
            graphify-out/GRAPH_REPORT.md
          then
            echo "::error::Graphify output is stale. Run 'graphify update .' locally and commit the generated changes."

            git diff --stat -- \
              graphify-out/graph.json \
              graphify-out/GRAPH_REPORT.md

            exit 1
          fi
