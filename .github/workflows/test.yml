name: Tests

# Reusable test projects. CI calls it per project; the release preflight runs all four.
on:
  workflow_call:
    inputs:
      app:
        type: boolean
        default: false
      native:
        type: boolean
        default: false
      tooling:
        type: boolean
        default: false
      kotlin:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: true
  HUSKY: 0
  ANDROID_BUILD_TOOLS_VERSION: 36.0.0
  ANDROID_NDK_VERSION: 27.1.12297006

jobs:
  app:
    name: App tests
    if: inputs.app
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test

  native:
    name: Native tests
    if: inputs.native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test:native

  tooling:
    name: Tooling tests
    if: inputs.tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test:tooling

  kotlin:
    name: Kotlin tests
    if: inputs.kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17.0.14'
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: ''
      - name: Install pinned Android toolchain
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" "ndk;${ANDROID_NDK_VERSION}"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prebuild Android project
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Tests
        run: pnpm test:kotlin
      - name: Summarize results
        if: ${{ !cancelled() }}
        run: |
          for module in liftlog-updater liftlog-exact-alarm; do
            cat modules/$module/android/build/test-results/testDebugUnitTest/*.xml 2>/dev/null |
              grep -o '<testsuite [^>]*>' |
              sed -E 's/.* tests="([0-9]+)" skipped="([0-9]+)" failures="([0-9]+)" errors="([0-9]+)".*/\1 \2 \3 \4/' |
              awk -v m="$module" '{t+=$1; s+=$2; f+=$3+$4} END {printf "%s: %d tests, %d skipped, %d failed\n", m, t, s, f}'
          done
